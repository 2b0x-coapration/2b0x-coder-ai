name: Build .deb

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build .deb
        run: npm run dist

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2b0x-coder-desktop-deb
          path: release/*.deb
